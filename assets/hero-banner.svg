<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="270">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120c"/>
      <stop offset="50%" stop-color="#0d261a"/>
      <stop offset="100%" stop-color="#09171e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#d4955a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#d4955a"/>
    </linearGradient>
    <radialGradient id="orb1" cx="82%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="18%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#d4955a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4955a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 40px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #f8f5ee; letter-spacing: -0.5px; }
      .accent { fill: #34d399; }
      .subtitle { font: 700 13px 'Consolas', 'Courier New', monospace; fill: #d4955a; letter-spacing: 2px; }
      .tagline { font: 400 14.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .badge-text { font: 700 10.5px 'Segoe UI', sans-serif; fill: #34d399; letter-spacing: 1.4px; }
      .node-label { font: 700 11px 'Consolas', monospace; fill: #e2e8f0; }
      .pulse-dot { animation: pulse 2.2s infinite ease-in-out; }
      .float-slow { animation: floatY 5s infinite ease-in-out; }
      .dash-flow { stroke-dasharray: 6 6; animation: dash 12s linear infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -120; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="266" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="266" rx="18" fill="url(#orb1)"/>
  <rect x="2" y="2" width="996" height="266" rx="18" fill="url(#orb2)"/>

  <g stroke="#34d399" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="68" x2="1000" y2="68"/>
    <line x1="0" y1="135" x2="1000" y2="135"/>
    <line x1="0" y1="202" x2="1000" y2="202"/>
    <line x1="250" y1="0" x2="250" y2="270"/>
    <line x1="500" y1="0" x2="500" y2="270"/>
    <line x1="750" y1="0" x2="750" y2="270"/>
  </g>

  <!-- Animated AI Network Graph -->
  <g class="float-slow">
    <path d="M680 80 L810 50 L915 108 L830 190 L695 170 Z" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5" class="dash-flow"/>
    <line x1="680" y1="80" x2="830" y2="190" stroke="#d4955a" stroke-opacity="0.28" stroke-width="1.2" class="dash-flow"/>
    <line x1="810" y1="50" x2="695" y2="170" stroke="#34d399" stroke-opacity="0.22" stroke-width="1.2" class="dash-flow"/>

    <circle r="4" fill="#34d399">
      <animateMotion dur="6s" repeatCount="indefinite" path="M680 80 L810 50 L915 108 L830 190 L695 170 Z"/>
    </circle>
    <circle r="3.5" fill="#d4955a">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M695 170 L810 50 L830 190 Z"/>
    </circle>

    <g transform="translate(632, 64)">
      <rect width="96" height="30" rx="7" fill="#0c2318" stroke="#34d399" stroke-width="1.3"/>
      <text x="48" y="19" text-anchor="middle" class="node-label">LOCAL LLM</text>
    </g>
    <g transform="translate(762, 34)">
      <rect width="98" height="30" rx="7" fill="#0c2318" stroke="#d4955a" stroke-width="1.3"/>
      <text x="49" y="19" text-anchor="middle" class="node-label">AI AGENTS</text>
    </g>
    <g transform="translate(864, 92)">
      <rect width="96" height="30" rx="7" fill="#0c2318" stroke="#34d399" stroke-width="1.3"/>
      <text x="48" y="19" text-anchor="middle" class="node-label">NLP &amp; OCR</text>
    </g>
    <g transform="translate(778, 175)">
      <rect width="104" height="30" rx="7" fill="#0c2318" stroke="#34d399" stroke-width="1.3"/>
      <text x="52" y="19" text-anchor="middle" class="node-label">REST / SQL</text>
    </g>
    <g transform="translate(640, 155)">
      <rect width="108" height="30" rx="7" fill="#0c2318" stroke="#d4955a" stroke-width="1.3"/>
      <text x="54" y="19" text-anchor="middle" class="node-label">AUDIT LOOP</text>
    </g>
  </g>

  <g transform="translate(48, 36)">
    <rect width="290" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
    <circle cx="16" cy="13" r="4.5" fill="#10b981" class="pulse-dot"/>
    <text x="30" y="17" class="badge-text">COMPUTER ENGINEERING · AI &amp; BACKEND</text>
  </g>

  <text x="48" y="114" class="title">Hi, I'm İbrahim <tspan class="accent">Türkel</tspan></text>
  <text x="48" y="146" class="subtitle">AI AGENTS · LOCAL LLMs · NLP/OCR · RELIABLE BACKEND SYSTEMS</text>
  <text x="48" y="180" class="tagline">Building practical software that turns AI ideas into maintainable,</text>
  <text x="48" y="202" class="tagline">testable, and human-controlled applications.</text>

  <rect x="48" y="226" width="180" height="4" rx="2" fill="url(#glowGrad)">
    <animate attributeName="width" values="130;250;130" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>