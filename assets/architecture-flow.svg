<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 185" width="100%" height="185">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07140e"/>
      <stop offset="100%" stop-color="#0b1922"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#d4955a"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .hdr { font: 700 11px 'Consolas', monospace; fill: #d4955a; letter-spacing: 2px; }
      .box-title { font: 700 13px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .box-sub { font: 400 11px 'Segoe UI', sans-serif; fill: #94a3b8; }
      .step-num { font: 800 10px 'Consolas', monospace; fill: #10b981; }
      .flow-line { stroke-dasharray: 6 6; animation: flow 8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -96; } }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="181" rx="14" fill="url(#cardBg)" stroke="#1e3a2f" stroke-width="1.5"/>
  <text x="32" y="28" class="hdr">END-TO-END AI &amp; BACKEND SYSTEM ARCHITECTURE PIPELINE</text>

  <!-- Connecting Flow Line -->
  <line x1="140" y1="102" x2="860" y2="102" stroke="url(#lineGrad)" stroke-width="2" class="flow-line"/>
  <circle r="4" fill="#34d399">
    <animateMotion dur="5s" repeatCount="indefinite" path="M140 102 L860 102"/>
  </circle>

  <!-- Stage 1 -->
  <g transform="translate(28, 46)">
    <rect width="215" height="112" rx="10" fill="#0d231a" stroke="#10b981" stroke-width="1.3"/>
    <text x="16" y="24" class="step-num">01 / INGESTION &amp; OCR</text>
    <text x="16" y="48" class="box-title">Document &amp; Data Stream</text>
    <text x="16" y="70" class="box-sub">• Historical OCR (Kraken/OpenCV)</text>
    <text x="16" y="88" class="box-sub">• Multi-Source News Crawlers</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(269, 46)">
    <rect width="215" height="112" rx="10" fill="#0d231a" stroke="#34d399" stroke-width="1.3"/>
    <text x="16" y="24" class="step-num">02 / AI &amp; LOCAL LLM</text>
    <text x="16" y="48" class="box-title">NLP &amp; Agent Workflows</text>
    <text x="16" y="70" class="box-sub">• Ollama / HF Local Inference</text>
    <text x="16" y="88" class="box-sub">• Semantic Ranking &amp; RAG</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(510, 46)">
    <rect width="215" height="112" rx="10" fill="#0d231a" stroke="#d4955a" stroke-width="1.3"/>
    <text x="16" y="24" class="step-num">03 / BACKEND &amp; DATA</text>
    <text x="16" y="48" class="box-title">REST APIs &amp; Persistence</text>
    <text x="16" y="70" class="box-sub">• Python / PHP / TypeScript</text>
    <text x="16" y="88" class="box-sub">• MySQL &amp; PostgreSQL Schemas</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(751, 46)">
    <rect width="221" height="112" rx="10" fill="#0d231a" stroke="#10b981" stroke-width="1.3"/>
    <text x="16" y="24" class="step-num">04 / HUMAN-IN-THE-LOOP</text>
    <text x="16" y="48" class="box-title">Verification &amp; Delivery</text>
    <text x="16" y="70" class="box-sub">• Explicit Approval Checkpoints</text>
    <text x="16" y="88" class="box-sub">• Auditable Logs &amp; Web UI</text>
  </g>
</svg>